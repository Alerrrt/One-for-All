version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: conversion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - conversion-network

  postgres:
    image: postgres:16-alpine
    container_name: conversion-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-conversion_engine}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conversion-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: conversion-api
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - API_PORT=3000
      - UPLOAD_DIR=/data/inputs
      - OUTPUT_DIR=/data/outputs
      - MAX_FILE_SIZE_MB=5000
      - MAX_CONCURRENT_JOBS=10
    volumes:
      - ./data:/data
      - ./api:/app/api
      - /app/api/node_modules
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - conversion-network

  worker-ffmpeg:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: conversion-worker-ffmpeg
    environment:
      - PROCESSOR_TYPE=ffmpeg
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=4
      - OUTPUT_DIR=/data/outputs
      - TEMP_DIR=/data/temp
    volumes:
      - ./data:/data
    depends_on:
      - redis
    deploy:
      replicas: 1
    networks:
      - conversion-network

  worker-image:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: conversion-worker-image
    environment:
      - PROCESSOR_TYPE=imagemagick
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=2
      - OUTPUT_DIR=/data/outputs
      - TEMP_DIR=/data/temp
    volumes:
      - ./data:/data
    depends_on:
      - redis
    deploy:
      replicas: 1
    networks:
      - conversion-network

  nginx:
    image: nginx:alpine
    container_name: conversion-nginx
    ports:
      - "3000:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - conversion-network

volumes:
  redis_data:
  postgres_data:


networks:
  conversion-network:
    driver: bridge
